<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Robot Arm stylized geometric silhouette -->
  <g transform="translate(180, 70)">
    <!-- Base -->
    <path d="M 120 280 L 320 280 L 300 240 L 140 240 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="180" y="210" width="80" height="30" rx="6" fill="#475569"/>
    
    <!-- Joint 1 -->
    <circle cx="220" cy="200" r="26" fill="url(#primaryGrad)" stroke="#60a5fa" stroke-width="3"/>
    
    <!-- Link 1 -->
    <path d="M 210 200 L 170 100 L 195 90 L 235 190 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Joint 2 -->
    <circle cx="180" cy="95" r="22" fill="#2563eb" stroke="#93c5fd" stroke-width="2.5"/>
    
    <!-- Link 2 -->
    <path d="M 180 95 L 300 50 L 308 72 L 188 117 Z" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Wrist & Gripper -->
    <circle cx="304" cy="61" r="16" fill="#38bdf8"/>
    <path d="M 304 61 L 340 50" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 340 40 L 365 40 M 340 60 L 365 60" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Coordinate targets -->
    <circle cx="370" cy="50" r="12" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="370" cy="50" r="3" fill="#ef4444"/>
  </g>
  
  <!-- Title overlay -->
  <rect x="40" y="350" width="360" height="65" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <text x="60" y="380" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="20" fill="#f8fafc">SO-ARM101</text>
  <text x="60" y="402" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">Bras Robotisé 6 Axes Open-Source (STS3215)</text>
</svg>
